<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital+print — Verucio Ferraz</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html">VERÚCIO FERRAZ</a>
    <nav>
      <a href="../index.html#work">Work</a>
      <a href="../index.html#about">About</a>
      <a href="../index.html#contact">Contact</a>
    </nav>
  </header>

  <main class="case-page">
    <a class="back" href="../index.html#work">← Selected Work</a>

    <section class="case-head">
      <h1>Digital+print</h1>
      <p>Projetos institucionais em formatos digitais e impressos, em colaboração com o Estúdio Nono para a Fundação Tide Setubal em várias publicações.</p>
    </section>

    <section class="case-grid">
      <figure class="wide">
        <img src="../images/books-territorio-tide.jpg"
             alt="Projeto editorial Digital+print">
      </figure>
        
 <figure>
  <a class="open-image" href="../images/Mapa-02.jpg">
    <img src="../images/Mapa-02.jpg" alt="Mapa 2">
  </a>
</figure>

<figure>
  <a class="open-image" href="../images/Mapa-03.jpg">
    <img src="../images/Mapa-03.jpg" alt="Mapa 3">
  </a>
</figure>
        
      <figure class="wide"><img src="../images/Mapa-04.jpg" alt="Mapa 4"></figure>
        
      <figure class="wide"><img src="../images/Mapa-05.jpg" alt="Mapa 5"></figure>
        
    </section>
  </main>
  <dialog class="image-lightbox" id="image-lightbox" aria-label="Imagem ampliada">
  <button class="lightbox-close" type="button" aria-label="Fechar imagem">×</button>
  <img src="" alt="">
</dialog>

<script>
  const lightbox = document.getElementById('image-lightbox');
  const largeImage = lightbox.querySelector('img');

  document.querySelectorAll('.open-image').forEach(link => {
    link.addEventListener('click', event => {
      event.preventDefault();
      largeImage.src = link.href;
      largeImage.alt = link.querySelector('img').alt;
      lightbox.showModal();
    });
  });

  lightbox.querySelector('.lightbox-close').addEventListener('click', () => {
    lightbox.close();
  });

  lightbox.addEventListener('click', event => {
    if (event.target === lightbox) lightbox.close();
  });
</script>
</body>
</html>
